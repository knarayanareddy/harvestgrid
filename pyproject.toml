[project]
name = "harvestgrid-domain"
version = "0.1.0"
description = "Deterministic HarvestGrid forecast-contract and coordinator-matching foundation"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema[format]==4.25.1",
  "numpy==2.3.4",
  "onnx==1.19.1",
  "onnxruntime==1.23.2",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==6.3.0",
  "ruff==0.13.2",
  "fastapi==0.120.4",
  "httpx==0.28.1",
  "uvicorn==0.38.0",
  "pillow==12.0.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/domain/harvestgrid_domain",
  "packages/matching/harvestgrid_domain_matching",
  "packages/vision/harvestgrid_vision",
  "packages/weather-client/harvestgrid_weather",
  "services/ring-adapter/harvestgrid_ring_adapter",
  "services/forecasting/harvestgrid_forecasting",
  "services/notifications/harvestgrid_notifications",
  "services/api/harvestgrid_api",
  "packages/testkit/harvestgrid_testkit",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "network: opt-in tests that contact a real external service (skipped by default)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
# Shipped code is type-checked strictly; the test suite is covered by pytest and ruff instead.
exclude = ["^tests/", "^tools/"]
files = [
  "packages/domain",
  "packages/matching",
  "packages/vision",
  "packages/weather-client",
  "services/ring-adapter",
  "services/forecasting",
  "services/notifications",
  "services/api",
  "packages/testkit",
]

# Tests are checked, but not under strict mode: helpers that build dataclasses from
# `**overrides` mappings are readable and safe at runtime, and pytest is the real verifier.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
